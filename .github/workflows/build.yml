# CopyAttach — GitHub Actions 自动构建工作流
#
# 功能:
#   - CI 构建: 每次 push/PR 到 master，验证编译通过
#   - 发布构建: 打 tag（如 v0.81.0）时自动构建并打包 DMG，上传到 Release
#   - 手动触发: 通过 GitHub 页面上的 "Run workflow" 按钮手动构建
#
# 使用前准备:
#   1. 代码签名（可选但强烈推荐）
#      在 repo Settings → Secrets and variables → Actions 中添加:
#      - MACOS_CERTIFICATE:       base64 编码的证书 (.p12，含私钥)
#      - MACOS_CERTIFICATE_PWD:   证书导出密码
#      - MACOS_NOTARIZATION_ACCOUNT: Apple ID 邮箱（用于公证，需 Developer ID）
#      - MACOS_NOTARIZATION_PWD:  Apple ID 应用专用密码
#      - APPLE_TEAM_ID:           团队 ID（如 XXXXXXXXXX）
#      签名身份必须跨版本稳定（Developer ID 或 Apple Development）：
#      否则每次更新发布版都会让用户重新弹钥匙串授权框。用稳定身份签名后，
#      用户首次点一次「始终允许」即可，之后所有版本更新都不再弹。
#   2. 不配置证书也可以构建，但打出的 DMG 是 ad-hoc 签名：会被 Gatekeeper
#      拦截，且每次更新都会重新弹钥匙串授权框。
#   3. 修改 CFBundleIdentifier（SwiftApp/Info.plist）为你的真实 bundle ID
#      （当前是 com.example.copyattach，不签名不影响使用）
#
# 触发方式:
#   - git tag v0.81.0 && git push origin v0.81.0
#   - 手动触发时勾选 "创建 GitHub Release" 可直接发布

name: Build CopyAttach

on:
  push:
#    branches: [master]
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - 'assets/**'
      - 'LICENSE'
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      create_release:
        description: 创建 GitHub Release（基于 Cargo.toml 版本号）
        type: boolean
        default: false
        required: false
      lanzou_upload:
        description: 同时上传到蓝奏云（仅建议本地验证通过后启用）
        type: boolean
        default: false
        required: false

# 环境变量
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ──────────────────────────────────────────────
  # 测试 + Lint（Rust）
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test

  # ──────────────────────────────────────────────
  # 构建 app bundle + 打包 DMG
  # ──────────────────────────────────────────────
  build:
    name: Build App
    needs: lint
    runs-on: macos-latest
    # 关联签名/公证 secrets 所在的环境（src2release-env），
    # 否则 job 看不到环境级 secrets，签名步骤会静默跳过
    environment: src2release-env
    outputs:
      version: ${{ steps.version.outputs.version }}
      dmg_name: ${{ steps.version.outputs.dmg_name }}

    steps:
      - uses: actions/checkout@v5

      # 读取版本号
      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(grep '^version = ' Cargo.toml | head -1 | sed 's/version = "\(.*\)"/\1/')
          ARCH=$(uname -m)
          case "$ARCH" in
            arm64|aarch64) ARCH="arm64" ;;
            x86_64|amd64) ARCH="x86_64" ;;
          esac
          DMG_NAME="CopyAttach-${VERSION}-macos-${ARCH}.dmg"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "dmg_name=${DMG_NAME}" >> "$GITHUB_OUTPUT"
          echo "Building CopyAttach v${VERSION} (${ARCH})"

      # 选择最新的 Xcode（build.sh 需要 macOS SDK 15.0，对应 Xcode 16+）
      - name: Select latest Xcode
        run: |
          AVAILABLE=$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V)
          LATEST=$(echo "$AVAILABLE" | tail -1)
          if [ -n "$LATEST" ]; then
            sudo xcode-select -s "$LATEST/Contents/Developer"
            echo "Selected Xcode: $(xcodebuild -version)"
          else
            echo "No Xcode.app found at standard paths, using xcrun fallback"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 Rust 构建产物
      - name: Cache Rust build
        uses: actions/cache@v5
        with:
          path: |
            target/release/
            target/release/build/
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      # 执行构建
      - name: Build app bundle
        run: ./build.sh

      # 代码签名（配好 MACOS_CERTIFICATE secret 后生效）
      # 用稳定签名身份（Developer ID 或 Apple Development）解决钥匙串弹窗：
      # 用户首次点一次「始终允许」，之后所有版本更新都不再弹。
      # 注意：不要在步骤级 if: 里判断 secret（env 上下文看不到 step 自己的
      # env 映射），改为脚本内判断。
      - name: Code sign (if certificate configured)
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          KEYCHAIN: ${{ runner.temp }}/build.keychain
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "::warning::未配置 MACOS_CERTIFICATE secret，跳过签名，产物为 ad-hoc（每次更新都会触发钥匙串弹窗）"
            exit 0
          fi
          # 导入证书到临时钥匙串
          echo "$MACOS_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p temp "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p temp "$KEYCHAIN"
          security import /tmp/cert.p12 -k "$KEYCHAIN" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k temp "$KEYCHAIN"

          # 签名（优先 Developer ID Application；也兼容 Apple Development）
          CODESIGN_IDENTITY=$(security find-identity -v -p basic "$KEYCHAIN" | grep -E "Developer ID Application|Apple Development" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ -z "$CODESIGN_IDENTITY" ]; then
            echo "::error::证书已配置但钥匙串中找不到可用签名身份（.p12 可能不含私钥或导出密码错误），构建失败以避免发布 ad-hoc 产物"
            security delete-keychain "$KEYCHAIN"
            exit 1
          fi
          echo "Signing with identity: ${CODESIGN_IDENTITY}"
          codesign --force --deep --sign "${CODESIGN_IDENTITY}" --keychain "$KEYCHAIN" CopyAttach.app
          codesign -dvvv CopyAttach.app

          security delete-keychain "$KEYCHAIN"

      # 打包 DMG
      - name: Package DMG
        run: build/package_dmg.sh

      # 公证（如果配置了 Apple ID；需 Developer ID 签名，Apple Development 不支持）
      - name: Notarize (if configured)
        env:
          AC_USERNAME: ${{ secrets.MACOS_NOTARIZATION_ACCOUNT }}
          AC_PASSWORD: ${{ secrets.MACOS_NOTARIZATION_PWD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$AC_USERNAME" ] || [ -z "$APPLE_TEAM_ID" ]; then
            echo "未配置公证 secrets（MACOS_NOTARIZATION_ACCOUNT / APPLE_TEAM_ID），跳过公证"
            exit 0
          fi

          DMG=$(ls build/CopyAttach-*.dmg | head -1)
          echo "Notarizing ${DMG}..."

          xcrun notarytool submit "$DMG" \
            --apple-id "$AC_USERNAME" \
            --password "$AC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          #  staple（将公证凭证附在 DMG 上）
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      # 上传 DMG 为构建产物
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v7
        with:
          name: CopyAttach-${{ steps.version.outputs.version }}
          path: build/CopyAttach-*.dmg
          if-no-files-found: error

  # ──────────────────────────────────────────────
  # 创建 GitHub Release
  # 触发方式：
  #   - 推送 tag v*（如 git push origin v0.81.0）
  #   - 手动触发 workflow 时勾选 "创建 GitHub Release"
  # ──────────────────────────────────────────────
  release:
    name: Publish Releases
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.create_release || inputs.lanzou_upload))
    needs: build
    runs-on: ubuntu-latest
    # PUBLIC_RELEASE_TOKEN is stored as an Environment secret in this environment.
    environment: src2release-env
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          # Extract exactly one version section. A missing section is a release
          # error so a published release can never silently lose its notes.
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found=1; print; next }
            found && /^## / { exit }
            found { print }
            END {
              if (!found) {
                print "Missing changelog section for version " version > "/dev/stderr"
                exit 1
              }
            }
          ' CHANGELOG.md > "$NOTES_FILE"
          test -s "$NOTES_FILE"
          echo "Release notes prepared for v${VERSION}"

      - name: Download DMG artifact
        uses: actions/download-artifact@v8
        with:
          name: CopyAttach-${{ needs.build.outputs.version }}
          path: build/

      # 蓝奏云上传已完成本地和 CI 验证。tag 发布自动上传；手动运行时需要显式勾选 lanzou_upload。
      - name: Upload to Lanzou Cloud
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.lanzou_upload)
        env:
          LANZOU_COOKIE: ${{ secrets.LANZOU_COOKIE }}
          VERSION: ${{ needs.build.outputs.version }}
          DMG_NAME: ${{ needs.build.outputs.dmg_name }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          test -n "$LANZOU_COOKIE" || { echo "::error::未配置 LANZOU_COOKIE secret"; exit 1; }
          python3 -m pip install --user -r scripts/requirements-lanzou.txt
          ZIP_NAME="${DMG_NAME%.dmg}.zip"
          ZIP_PATH="build/${ZIP_NAME}"
          zip -j "$ZIP_PATH" build/CopyAttach-*.dmg
          python3 scripts/lanzou_uploader.py "$ZIP_PATH" \
            --folder-name "copyattach" \
            --password "1234"
          # 稳定入口：dl.abovepast.shop/lanzou 每次 302 到当前可用的蓝奏域名，
          # 蓝奏轮换域名时无需改动本文件或重发 Release。
          printf '\n---\n### 国内下载\n- [蓝奏云下载](https://dl.abovepast.shop/lanzou)（提取码：`1234`）\n' >> "$NOTES_FILE"

      # The automatic GITHUB_TOKEN publishes a private release in the source repo.
      - name: Create or update private source release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          TAG="v${VERSION}"

          if ! gh release view "$TAG" --repo "$SOURCE_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$SOURCE_REPOSITORY" \
              --title "CopyAttach ${TAG}" \
              --notes-file "$NOTES_FILE"
          else
            gh release edit "$TAG" \
              --repo "$SOURCE_REPOSITORY" \
              --notes-file "$NOTES_FILE"
          fi

          gh release upload "$TAG" build/CopyAttach-*.dmg \
            --repo "$SOURCE_REPOSITORY" \
            --clobber

      # The fine-grained PAT publishes the same release in the public repo.
      - name: Create or update public release
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}
          PUBLIC_REPOSITORY: wonaren/copyattach-release
          VERSION: ${{ needs.build.outputs.version }}
          NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: |
          TAG="v${VERSION}"

          if ! gh release view "$TAG" --repo "$PUBLIC_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$PUBLIC_REPOSITORY" \
              --title "CopyAttach ${TAG}" \
              --notes-file "$NOTES_FILE"
          else
            gh release edit "$TAG" \
              --repo "$PUBLIC_REPOSITORY" \
              --notes-file "$NOTES_FILE"
          fi

          gh release upload "$TAG" build/CopyAttach-*.dmg \
            --repo "$PUBLIC_REPOSITORY" \
            --clobber
