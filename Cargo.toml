[package]
name = "copy-attach"
version = "0.1.0-beta"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]
name = "copy_attach"

[dependencies]
arboard = "3.6"
objc2 = "0.6"
objc2-core-graphics = "0.3"
objc2-foundation = "0.3"
block2 = "0.6"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[profile.release]
strip = true
lto = true
codegen-units = 1
