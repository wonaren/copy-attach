<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- 底座阴影 -->
    <filter id="shadow-base" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <!-- 卡片阴影 -->
    <filter id="shadow-card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.35"/>
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.2"/>
    </filter>

    <!-- 回形针阴影 -->
    <filter id="shadow-clip" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>

    <!-- 金属反光渐变 -->
    <linearGradient id="metal-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="15%" stop-color="#E2E8F0"/>
      <stop offset="30%" stop-color="#94A3B8"/>
      <stop offset="45%" stop-color="#cbd5e1"/>
      <stop offset="55%" stop-color="#FFFFFF"/>
      <stop offset="70%" stop-color="#64748B"/>
      <stop offset="85%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- 底盘背景渐变：深邃的高级暗灰蓝色 -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2330"/>
      <stop offset="100%" stop-color="#0D0F14"/>
    </linearGradient>

    <!-- 底盘亮边渐变 -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A5568" stop-opacity="0.8"/>
      <stop offset="30%" stop-color="#2D3748" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1A202C" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#718096" stop-opacity="0.5"/>
    </linearGradient>

    <!-- 极光卡片渐变 (图片卡片)：高饱和度的现代科技感渐变 -->
    <linearGradient id="aurora-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- 毛玻璃文本卡片渐变 -->
    <linearGradient id="glass-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>

    <!-- 装饰球的微弱渐变 -->
    <radialGradient id="glow-grad" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#A855F7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- 1. APP 图标底盘（带投影与精细描边） -->
  <rect x="44" y="44" width="424" height="424" rx="92"
        fill="url(#bg-grad)"
        stroke="url(#border-grad)"
        stroke-width="2"
        filter="url(#shadow-base)"/>

  <!-- 2. 背景微弱的炫光效果，增加立体质感 -->
  <circle cx="256" cy="256" r="200" fill="url(#glow-grad)" pointer-events="none"/>

  <!-- 3. 第一层：文本卡片 (左侧倾斜，半透明毛玻璃) -->
  <g transform="translate(145, 175) rotate(-12)">
    <!-- 卡片主体 -->
    <rect x="0" y="0" width="150" height="210" rx="14"
          fill="url(#glass-grad)"
          stroke="rgba(255, 255, 255, 0.15)"
          stroke-width="1.5"
          filter="url(#shadow-card)"/>

    <!-- 模拟文本行 -->
    <!-- 标题行 -->
    <rect x="18" y="22" width="55" height="8" rx="4" fill="rgba(255, 255, 255, 0.4)"/>
    <!-- 正文行 -->
    <rect x="18" y="42" width="114" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.25)"/>
    <rect x="18" y="55" width="100" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.25)"/>
    <rect x="18" y="68" width="114" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.25)"/>
    <rect x="18" y="81" width="80" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.25)"/>

    <rect x="18" y="102" width="40" height="6" rx="3" fill="rgba(255, 255, 255, 0.3)"/>
    <rect x="18" y="118" width="114" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.2)"/>
    <rect x="18" y="131" width="108" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.2)"/>
    <rect x="18" y="144" width="60" height="5" rx="2.5" fill="rgba(255, 255, 255, 0.2)"/>
  </g>

  <!-- 4. 第二层：媒体卡片 (右侧倾斜，多彩绚丽极光) -->
  <g transform="translate(225, 135) rotate(14)">
    <!-- 卡片主体 -->
    <rect x="0" y="0" width="150" height="210" rx="14"
          fill="url(#aurora-grad)"
          stroke="rgba(255, 255, 255, 0.3)"
          stroke-width="1.5"
          filter="url(#shadow-card)"/>

    <!-- 极光卡片内的抽象山水图案 (插画感) -->
    <!-- 太阳 -->
    <circle cx="115" cy="40" r="14" fill="#FFFFFF" opacity="0.9"/>

    <!-- 山峰 1 (后面) -->
    <path d="M -10 210 L 60 110 L 130 210 Z" fill="#FFFFFF" opacity="0.15"/>

    <!-- 山峰 2 (前面) -->
    <path d="M 30 210 L 105 85 L 170 210 Z" fill="#FFFFFF" opacity="0.25"/>

    <!-- 前景线条 -->
    <path d="M 20 180 Q 75 140 130 180" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  </g>

  <!-- 5. 第三层：高质感金属回形针 (置于上方，别住两张卡片) -->
  <g transform="translate(256, 250) rotate(-38) scale(1.65)">
    <!-- 阴影层：使用纯黑模糊，给回形针更强的悬浮 3D 投影 -->
    <path d="M -8 20 L -8 -20 A 8 8 0 0 1 8 -20 L 8 40 A 16 16 0 0 1 -24 40 L -24 -50 A 24 24 0 0 1 24 -50 L 24 60"
          fill="none"
          stroke="#000000"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.45"
          filter="url(#shadow-clip)"/>

    <!-- 主金属体 -->
    <path d="M -8 20 L -8 -20 A 8 8 0 0 1 8 -20 L 8 40 A 16 16 0 0 1 -24 40 L -24 -50 A 24 24 0 0 1 24 -50 L 24 60"
          fill="none"
          stroke="url(#metal-grad)"
          stroke-width="7.5"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- 金属反光脊线 (高光细线) -->
    <path d="M -8 20 L -8 -20 A 8 8 0 0 1 8 -20 L 8 40 A 16 16 0 0 1 -24 40 L -24 -50 A 24 24 0 0 1 24 -50 L 24 60"
          fill="none"
          stroke="#FFFFFF"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.85"/>
  </g>
</svg>
