<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Logo 4: Stack (Color Version)
       三条历史记录从蓝渐变到深色
       顶部（最新）= Action Blue → 底部（最旧）= Ink
       层次代表时间的推移 -->
  <!-- 条 1（最近 — Action Blue） -->
  <rect x="76" y="86" width="300" height="70" rx="18" fill="#0066cc"/>
  <!-- 条 2（中间 — 过渡色） -->
  <rect x="76" y="201" width="363" height="70" rx="18" fill="#333399"/>
  <!-- 条 3（最早 — Ink） -->
  <rect x="76" y="316" width="425" height="70" rx="18" fill="#1d1d1f"/>
  <!-- 底部指示线（更多条目 — 浅灰） -->
  <rect x="76" y="411" width="100" height="70" rx="18" fill="#8e8e93"/>
</svg>
